services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - todo_mysql_prod:/var/lib/mysql
      - ./docker/mysql/conf.d/clearlist.cnf:/etc/mysql/conf.d/clearlist.cnf:ro
    tmpfs:
      - /var/run/mysqld:rw,nosuid,nodev,noexec,mode=0750,uid=999,gid=999
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable image reference}
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env.prod
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "su -s /bin/sh www-data -c 'php artisan migrate --force' && exec php-fpm -F"]
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an immutable image reference}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.clearlist-api.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)
      - traefik.http.routers.clearlist-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.clearlist-api.tls=true
      - traefik.http.routers.clearlist-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.clearlist-api.loadbalancer.server.port=80

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable image reference}
    restart: unless-stopped
    init: true
    env_file:
      - ./frontend/.env.prod
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.clearlist-app.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.clearlist-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.clearlist-app.tls=true
      - traefik.http.routers.clearlist-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.clearlist-app.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  todo_mysql_prod:

networks:
  app_internal:
    driver: bridge
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
