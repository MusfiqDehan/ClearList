services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo_app
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - todo_mysql_local:/var/lib/mysql
      - ./docker/mysql/conf.d/clearlist.cnf:/etc/mysql/conf.d/clearlist.cnf:ro
    tmpfs:
      - /var/run/mysqld:rw,nosuid,nodev,noexec,mode=0750,uid=999,gid=999
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - ./backend/.env.local
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "su -s /bin/sh www-data -c 'php artisan migrate --force' && exec php-fpm -F"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    env_file:
      - ./frontend/.env.local
    depends_on:
      nginx:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  todo_mysql_local:
